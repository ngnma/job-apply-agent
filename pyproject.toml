[project]
name = "job-apply-agent"
version = "0.1.0"
description = "AI agent that automates UK job applications"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic[email]>=2.7",
    "python-docx>=1.2",
    "pypdf>=5.0",
    "langchain-ollama>=1.1.0",
    "langchain-postgres>=0.0.19",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "httpx>=0.28.1",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.23.1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]
