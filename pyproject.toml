[project]
name = "job-apply-agent"
version = "0.1.0"
description = "AI agent that automates UK job applications"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic[email]>=2.7",
    "python-docx>=1.2",
    "pypdf>=5.0",
    "langchain-ollama>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]
