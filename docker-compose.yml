services:
  db:
    image: pgvector/pgvector:pg17   # Postgres 17 with the pgvector extension installed
    container_name: job-agent-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-job_agent}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-job_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
